name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main-custom

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-custom
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add/fetch upstream
        run: |
          git remote add upstream https://github.com/bitwarden/clients.git || true
          git fetch upstream main

      - name: Update main-upstream mirror
        run: |
          git checkout -B main-upstream upstream/main
          git push origin main-upstream --force

      - name: Merge upstream into main-custom
        run: |
          git checkout main-custom
          git merge --no-edit main-upstream || true

      - name: Push main-custom
        run: |
          git push origin main-custom
